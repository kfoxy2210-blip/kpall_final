# GitHub me yeh file `.github/workflows/kpall_final.yml` naam se banao (text copy-paste).
# Repo me kpall_final.zip upload karo (ya zip kholkar 4 folders seedhe upload karo) - 4 APK ban jayenge.
name: Build kpall_final
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [KPs_Algo, KPs_Multi, KPs_Pine, KPs_Auto]
    steps:
      - uses: actions/checkout@v4
      - name: Unzip (agar kpall_final.zip upload kiya hai)
        run: |
          if [ -f kpall_final.zip ]; then unzip -oq kpall_final.zip; fi
          if [ -d kpall_final ]; then cp -r kpall_final/* . ; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: ${{ matrix.app }}
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist
          cp ${{ matrix.app }}/app/build/outputs/apk/release/*.apk "dist/${{ matrix.app }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: dist/${{ matrix.app }}.apk
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kpall_final-${{ github.run_number }}
          name: kpall_final build ${{ github.run_number }}
          files: dist/*.apk
